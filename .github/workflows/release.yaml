# Manual release:
# 1. tag: take the X.Y.Z-next version of the selected branch, drop "-next",
#    commit that version and push it as tag vX.Y.Z (the branch itself is not
#    updated, so it stays on -next);
# 2. build: test and build the Linux binaries from the tag;
# 3. release: publish them in a GitHub release;
# 4. bump-next-version: when releasing from main, open a pull request moving
#    main to X.(Y+1).0-next.

name: release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: true
        default: main

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PACKAGE: openshell-admission-hook

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Compute release version
        id: version
        run: |
          current=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg p "${PACKAGE}" '.packages[] | select(.name == $p) | .version')
          echo "current version: ${current}"
          [[ "${current}" == *-next ]] \
            || { echo "::error::expected a X.Y.Z-next version on ${{ inputs.branch }}, found ${current}"; exit 1; }
          version="${current%-next}"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::tag ${tag} already exists"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo set-version --workspace "${VERSION}"

      - name: Commit and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -s -m "chore: 🥁 tagging ${TAG} 🥳"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

  build:
    name: Build (linux/${{ matrix.arch }})
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # build.rs downloads the OpenShell protos for the version in openshell.version
      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check binary version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          version=$(./target/release/openshell-admission-hook --version)
          echo "${version}"
          [[ "${version}" == "openshell-admission-hook ${VERSION}" ]] \
            || { echo "::error::expected version ${VERSION}, got ${version}"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openshell-admission-hook-linux-${{ matrix.arch }}
          path: target/release/openshell-admission-hook
          if-no-files-found: error

  release:
    name: Release
    needs: [tag, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: false

      # artifacts/<name>/openshell-admission-hook -> dist/<name>, plus checksums
      - name: Prepare release assets
        run: |
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "${dir}")
            install -m 0755 "${dir}/openshell-admission-hook" "dist/${name}"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag \
            dist/*

  bump-next-version:
    name: Bump next version
    needs: [tag, release]
    if: ${{ inputs.branch == 'main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.KAIDEN_BOT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Compute next version
        id: version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          major=$(echo "${VERSION}" | cut -d. -f1)
          minor=$(echo "${VERSION}" | cut -d. -f2)
          echo "next_version=${major}.$((minor + 1)).0-next" >> "${GITHUB_OUTPUT}"

      - name: Bump version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: cargo set-version --workspace "${NEXT_VERSION}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.KAIDEN_BOT_TOKEN }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          branch="bump-next-${NEXT_VERSION}"
          git checkout -b "${branch}"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -s -m "chore: bump version to ${NEXT_VERSION}"
          git push origin "${branch}"
          pr_url=$(gh pr create \
            --title "chore: bump version to ${NEXT_VERSION}" \
            --body "Bump version to \`${NEXT_VERSION}\` after release \`${TAG}\`." \
            --base main \
            --head "${branch}")
          echo "Pull request created: ${pr_url}"
          gh pr ready "${pr_url}"
          gh pr merge "${pr_url}" --auto --rebase
